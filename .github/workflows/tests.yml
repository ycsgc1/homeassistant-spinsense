name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # play_clock.py imports nothing from Home Assistant, precisely so its
      # arithmetic can be checked without standing up a HA environment.
      - run: python -m unittest discover -s tests -v
